services:
  api:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: proctoring-base
    container_name: proctoring-api
    restart: unless-stopped
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "80"]
    environment:
      - SERVER_PORT=80
    env_file:
      - aws/.env.aws
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: proctoring-base
    container_name: proctoring-worker
    restart: unless-stopped
    command: ["python", "worker.py", "--threads", "6", "--models-dir", "/app/models"]
    environment:
      - MODELS_DIR=/app/models
    env_file:
      - aws/.env.aws
    volumes:
      - ./best.pt:/app/models/best.pt:ro
      - ./yolov8n.pt:/app/models/yolov8n.pt:ro
      - ./face_landmarker.task:/app/models/face_landmarker.task:ro
      - ./yamnet_class_map.csv:/app/models/yamnet_class_map.csv:ro
    healthcheck:
      test: ["CMD", "pgrep", "-f", "worker.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        # any